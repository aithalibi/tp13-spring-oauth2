# Profil de test : aucun appel reseau n'est effectue (issuer-uri remplace par des
# points explicites) afin que le contexte Spring demarre hors ligne.
spring:
  security:
    oauth2:
      client:
        registration:
          test:
            client-id: test-client
            client-secret: test-secret
            client-name: Test Provider
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/test"
            scope:
              - openid
              - profile
              - email
        provider:
          test:
            authorization-uri: http://localhost:9999/oauth2/authorize
            token-uri: http://localhost:9999/oauth2/token
            user-info-uri: http://localhost:9999/oauth2/userinfo
            user-name-attribute: sub

logging:
  level:
    org.springframework.security: WARN
