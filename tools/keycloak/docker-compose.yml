# Keycloak local pour le profil « keycloak » (etape 6 du TP13).
#
# Demarrage :
#   docker compose -f tools/keycloak/docker-compose.yml up -d
#
# Console d'administration : http://localhost:8180  (admin / admin)
# Realm importe automatiquement : ens-realm
#
# Puis lancer l'application avec :
#   APP_PROFILE=keycloak  (Windows : $env:APP_PROFILE='keycloak')

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tp13-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./ens-realm.json:/opt/keycloak/data/import/ens-realm.json:ro
